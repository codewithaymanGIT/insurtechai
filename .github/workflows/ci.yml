name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Translation catalogs are complete and placeholder-safe
        run: |
          npm run i18n:extract
          npm run i18n:build
          git diff --exit-code -- shared/src/i18n/catalogs || (echo "Catalogs are out of date: run npm run i18n:build and commit." && exit 1)
      - run: npm run build

  model:
    name: Claim frequency model (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
